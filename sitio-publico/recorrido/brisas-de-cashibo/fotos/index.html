function proyecta(az, el){                            // rumbo/altura (grados) -> pixel en pantalla
  const a = rad(az), e = rad(el), w = [Math.sin(a)*Math.cos(e), Math.cos(a)*Math.cos(e), Math.sin(e)];
  const cy = Math.cos(rad(V.yaw)), sy = Math.sin(rad(V.yaw)); let d = [w[0]*cy - w[1]*sy, w[0]*sy + w[1]*cy, w[2]];
  const cp = Math.cos(rad(V.pit)), sp = Math.sin(rad(V.pit)); d = [d[0], d[1]*cp + d[2]*sp, -d[1]*sp + d[2]*cp];
  if (d[1] < 0.04) return null; const tf = Math.tan(rad(V.fov)/2), asp = innerWidth/innerHeight;
  return [(d[0]/d[1]/(tf*asp)*0.5 + 0.5)*innerWidth, (0.5 - d[2]/d[1]/tf*0.5)*innerHeight];
}
function haciaSuelo(f, x, y){ const dx = x - f.x, dy = y - f.y, d = Math.hypot(dx, dy); return {az: grad(Math.atan2(dx, dy)), el: grad(Math.atan2(-f.h, d)), d}; }
const angDif = (a, b) => ((a - b + 540) % 360) - 180;

// ---------- lo que se dibuja encima: círculos para moverse, nombres de lugares y calles ----------
const capa = $('capa'); let marcas = [], rotulos = [], callesVis = [];
const flechaSVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 14.5 12 8.5l6 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function arma(){
  capa.innerHTML = ''; marcas = []; rotulos = [];
  const f = actual;
  D.fotos.forEach(g => { if (g === f) return;
    const m = document.createElement('div'); m.className = 'ir'; let az, el, sub;
    if (g.id === 'alta'){                              // la vista alta queda en el cielo: botón para subir
      const s = haciaSuelo(f, g.x, g.y); az = s.az; el = Math.min(grad(Math.atan2(g.h - f.h, s.d)), 16); m.classList.add('subir'); sub = `subir a ${g.h} m`;
    } else { const s = haciaSuelo(f, g.x, g.y); az = s.az; el = s.el; sub = f.id === 'alta' ? `a ${g.h} m de altura` : `a ${Math.round(s.d)} m`; }
    m.innerHTML = `<div class="aro">${flechaSVG}</div><div class="tx">${g.nombre}<small>${sub}</small></div>`;
    m.setAttribute('role', 'button'); m.tabIndex = 0; m.setAttribute('aria-label', 'Ir a ' + g.nombre);
    m.onclick = e => { e.stopPropagation(); ir(g.id); }; m.onkeydown = e => { if (e.key === 'Enter') ir(g.id); };
    m._az = az; m._el = el; capa.appendChild(m); marcas.push(m); });
  D.lugares.forEach(l => {
    if (l.solo && l.solo !== f.id) return;
    let az, el, d = 1e9;
    if (l.rumbo !== undefined){ az = l.rumbo; el = l.el; } else { const s = haciaSuelo(f, l.x, l.y); az = s.az; el = s.el; d = s.d; }
    if (l.min && d < l.min) return; if (l.max && d > l.max) return;
    const r = document.createElement('div'); r.className = 'rot' + (l.prin ? ' prin' : ''); r.innerHTML = '<i></i><b></b><span></span>'; r.lastChild.textContent = l.t;
    r._az = az; r._el = el; capa.appendChild(r); rotulos.push(r); });
  const C = D.calles; callesVis = C.seg.map(s => [haciaSuelo(f, C.x0 + s[0], C.y0 + s[1]), haciaSuelo(f, C.x0 + s[2], C.y0 + s[3])]);
}
function pinta(){
  marcas.forEach(m => { const q = proyecta(m._az, m._el); m.style.display = q ? '' : 'none'; if (q){ m.style.left = q[0] + 'px'; m.style.top = q[1] + 'px'; } });
  const vis = [];
  rotulos.forEach(r => { const q = proyecta(r._az, r._el); r.style.display = q ? '' : 'none'; if (q){ r.style.left = q[0] + 'px'; r.style.top = q[1] + 'px'; vis.push({r, x: q[0], y: q[1], w: r.lastChild.offsetWidth, a: r.lastChild.offsetHeight}); } });
  vis.sort((p, q) => q.y - p.y); const puestos = [];
  vis.forEach(v => { let h = 36, cabe = false; while (!cabe && h < 190){ const arriba = v.y - h - 5 - v.a; cabe = !puestos.some(o => Math.abs(o.x - v.x) < (o.w + v.w)/2 + 14 && arriba < o.arriba + o.a + 6 && arriba + v.a + 6 > o.arriba); if (!cabe) h += 8; } v.arriba = v.y - h - 5 - v.a; v.r.style.setProperty('--h', h + 'px'); puestos.push(v); });
  let dd = '';
  if (!document.body.classList.contains('sin-calles') && !fundido){
    callesVis.forEach(([a, b]) => { if (a.el < -84 || b.el < -84) return; const p = proyecta(a.az, a.el), q = proyecta(b.az, b.el); if (p && q) dd += `M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}`; });
  }
  $('calles').querySelectorAll('path').forEach(p => p.setAttribute('d', dd));
}

// ---------- cambiar de vista ----------
function textos(){
  const f = actual; $('nombre').textContent = f.nombre; $('altura').textContent = `Foto con dron a ${f.h} m de altura · feb. 2026`;
  document.querySelectorAll('.mini').forEach(m => { const on = m.dataset.id === f.id; m.classList.toggle('act', on); m.setAttribute('aria-selected', on); });
  document.title = `${f.nombre} · Fotos 360° · Las Brisas de Cashibo`;
}
async function ir(id, inicial){
  if (fundido || (actual && actual.id === id)) return;
  const g = porId[id]; let im;
  try { im = await imagen(id, '2k'); } catch (e){ toast('No se pudo cargar esta vista. Revisa tu conexión.'); return; }
  const t = textura(im, g.centro);
  if (!actual || inicial){
    texA = t; actual = g; nivelTex = 0;
    if (!inicial){ V.yaw = g.yaw; V.pit = g.pit; }
    arma(); textos(); mejora(); sucio = true; return;
  }
  const de = actual, sube = id === 'alta', baja = de.id === 'alta';
  texB = t; nivelTex = 0;
  const yaw1 = sube ? g.yaw : baja ? V.yaw : V.yaw, pit1 = sube ? g.pit : baja ? -14 : V.pit;
  fundido = {t0: performance.now(), largo: 900, y0: V.yaw, dy: angDif(yaw1, V.yaw), p0: V.pit, p1: pit1, f0: V.fov, f1: Math.min(FOV0, Math.max(V.fov, 50))};
  actual = g; capa.innerHTML = ''; marcas = []; rotulos = []; textos(); guarda();
}
async function mejora(){                              // 2k -> 4k -> 8k sin mover la vista
  const id = actual.id;
  for (let i = nivelTex + 1; i < TAMS.length; i++){
    let im; try { im = await imagen(id, TAMS[i]); } catch (e){ return; }
    if (!actual || actual.id !== id || fundido) return;
    const t = textura(im, actual.centro); gl.deleteTexture(texA.t); texA = t; nivelTex = i; sucio = true;
  }
  ORDEN.forEach(k => { if (k !== id) imagen(k, '2k').catch(() => {}); });    // las demás vistas, listas para el salto
}

// ---------- galería ----------
ORDEN.forEach(id => { const f = porId[id], m = document.createElement('div'); m.className = 'mini'; m.dataset.id = id; m.setAttribute('role', 'tab'); m.tabIndex = 0;
  m.style.backgroundImage = `url("${BASE}${id}-min.webp?v=${VER}")`; m.innerHTML = `<span>${f.nombre}</span>`;
  m.onclick = () => ir(id); m.onkeydown = e => { if (e.key === 'Enter') ir(id); }; $('galeria').appendChild(m); });

// ---------- mover la vista: arrastre con inercia, pellizco, rueda y teclado ----------
const ptrs = new Map(); let pinch0 = 0, fov0 = V.fov;
const nota = () => { tocado = performance.now(); ocultaAviso(); };
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); vel = {yaw: 0, pit: 0}; cv.classList.add('arrastra'); nota();
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); fov0 = V.fov; } });
cv.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; const [x0, y0] = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); nota();
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; V.fov = Math.min(FOVMAX, Math.max(FOVMIN, fov0*pinch0/Math.max(1, Math.hypot(a[0] - b[0], a[1] - b[1])))); sucio = true; return; }
  const k = V.fov/innerHeight; vel.yaw = -(e.clientX - x0)*k; vel.pit = (e.clientY - y0)*k; V.yaw += vel.yaw; V.pit += vel.pit; sucio = true; });
const suelta = e => { ptrs.delete(e.pointerId); if (!ptrs.size) cv.classList.remove('arrastra'); };
cv.addEventListener('pointerup', suelta); cv.addEventListener('pointercancel', suelta);
cv.addEventListener('wheel', e => { e.preventDefault(); V.fov = Math.min(FOVMAX, Math.max(FOVMIN, V.fov*(1 + Math.sign(e.deltaY)*0.08))); sucio = true; nota(); }, {passive: false});
const TECLAS = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1], KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, 1], KeyS: [0, -1]}, apretadas = new Set();
addEventListener('keydown', e => { if (TECLAS[e.code]){ apretadas.add(e.code); e.preventDefault(); nota(); } else if (e.key === '+' || e.key === '='){ V.fov = Math.max(FOVMIN, V.fov*0.9); sucio = true; } else if (e.key === '-'){ V.fov = Math.min(FOVMAX, V.fov*1.1); sucio = true; } });
addEventListener('keyup', e => apretadas.delete(e.code)); addEventListener('blur', () => apretadas.clear());

// ---------- botones ----------
$('bCalles').onclick = () => { const sin = document.body.classList.toggle('sin-calles'); $('bCalles').setAttribute('aria-pressed', !sin); sucio = true; };
$('bPantalla').onclick = () => { const d = document; if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => toast('Tu celular no permite pantalla completa aquí'))).call(el); } };
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('bPantalla').style.display = 'none';
function enlace(){ return location.origin + location.pathname + '#' + [actual.id, Math.round(V.yaw), Math.round(V.pit)].join(','); }
$('bCompartir').onclick = async () => { const url = enlace(), datos = {title: 'Las Brisas de Cashibo · Fotos 360°', text: `${actual.nombre} · Las Brisas de Cashibo en 360°`, url};
  if (navigator.share){ try { await navigator.share(datos); return; } catch (e){ if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); toast('Enlace copiado: pégalo donde quieras'); } catch (e){ prompt('Copia este enlace:', url); } };
let tToast = 0; function toast(t){ const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(tToast); tToast = setTimeout(() => el.style.opacity = 0, 2600); }
let avisoVisto = true; function ocultaAviso(){ if (!avisoVisto) return; avisoVisto = false; setTimeout(() => $('aviso').style.opacity = 0, 1800); }
setTimeout(ocultaAviso, 7000);
let tGuarda = 0; function guarda(){ clearTimeout(tGuarda); tGuarda = setTimeout(() => { if (actual) history.replaceState(null, '', '#' + [actual.id, Math.round(V.yaw), Math.round(V.pit)].join(',')); }, 600); }

// ---------- cuadro a cuadro ----------
let tPrev = performance.now(), ultimo = '';
function cuadro(){
  const ahora = performance.now(), dt = Math.min(0.05, (ahora - tPrev)/1000); tPrev = ahora;
  if (!ptrs.size && !fundido && (Math.abs(vel.yaw) > 0.002 || Math.abs(vel.pit) > 0.002)){ V.yaw += vel.yaw; V.pit += vel.pit; vel.yaw *= 0.92; vel.pit *= 0.92; sucio = true; }
  if (apretadas.size){ let gx = 0, gy = 0; apretadas.forEach(c => { gx += TECLAS[c][0]; gy += TECLAS[c][1]; }); V.yaw += gx*V.fov*0.9*dt; V.pit += gy*V.fov*0.6*dt; sucio = true; }
  if (!fundido && !ptrs.size && !apretadas.size && texA && ahora - tocado > 6000){ V.yaw += dt*2.4; sucio = true; }   // giro lento si nadie toca
  let m = 0;
  if (fundido){
    const k = Math.min(1, (ahora - fundido.t0)/fundido.largo), z = k*k*(3 - 2*k); m = z;
    V.yaw = fundido.y0 + fundido.dy*z; V.pit = fundido.p0 + (fundido.p1 - fundido.p0)*z; V.fov = fundido.f0 + (fundido.f1 - fundido.f0)*z + Math.sin(Math.PI*z)*-6;
    if (k >= 1){ gl.deleteTexture(texA.t); texA = texB; texB = null; fundido = null; m = 0; arma(); mejora(); }
    sucio = true;
  }
  V.pit = Math.max(-88, Math.min(88, V.pit)); V.yaw = (V.yaw % 360 + 360) % 360;
  const firma = [V.yaw.toFixed(3), V.pit.toFixed(3), V.fov.toFixed(3), m.toFixed(3)].join();
  if (texA && (sucio || firma !== ultimo)){
    ultimo = firma; sucio = false;
    const tf = Math.tan(rad(V.fov)/2), pxRad = cv.height/(2*tf), lod = t => Math.max(0, Math.log2((t.w/(2*Math.PI))/pxRad));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texA.t); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, (texB || texA).t);
    gl.uniform1f(u.yaw, rad(V.yaw)); gl.uniform1f(u.pit, rad(V.pit)); gl.uniform1f(u.tf, tf); gl.uniform1f(u.asp, cv.width/cv.height); gl.uniform1f(u.mixv, m);
    gl.uniform1f(u.c0, rad(texA.centro)); gl.uniform1f(u.c1, rad((texB || texA).centro));
    gl.uniform1f(u.lod0, lod(texA)); gl.uniform1f(u.lod1, lod(texB || texA));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    pinta(); if (!fundido) guarda();
  }
  requestAnimationFrame(cuadro);
}
// ---------- arranque: #vista,rumbo,altura en el enlace abre ese mismo encuadre ----------
(async function(){
  const h = decodeURIComponent(location.hash.slice(1)).split(','), id = porId[h[0]] ? h[0] : 'v1';
  const f = porId[id]; V.yaw = isFinite(+h[1]) && h[1] !== '' ? +h[1] : f.yaw; V.pit = isFinite(+h[2]) && h[2] !== '' ? +h[2] : f.pit;
  await ir(id, true);
  if (!texA){ $('cargando').querySelector('small').textContent = 'No se pudo cargar. Revisa tu conexión y recarga.'; return; }
  $('cargando').style.opacity = 0; setTimeout(() => $('cargando').remove(), 700);
  requestAnimationFrame(cuadro);
})();
</script>
