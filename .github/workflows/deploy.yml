name: Redireccion de softurbis.github.io/crm

# Desde el 15 sep 2026 el sistema vive en el dominio propio y lo publica
# Cloudflare en cada push a main (wrangler.panel.jsonc y wrangler.publico.jsonc).
# GitHub Pages ya NO publica la app: solo deja una redireccion para que los
# marcadores y los links viejos (softurbis.github.io/crm/...) lleguen al lugar
# nuevo. Por eso solo corre cuando cambia la redireccion.

on:
  push:
    branches: [main]
    paths:
      - 'redireccion-github/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # la misma pagina en index y en 404: cualquier ruta vieja cae en la redireccion
      - run: mkdir -p salida && cp redireccion-github/index.html salida/index.html && cp redireccion-github/index.html salida/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: salida

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Publicar (intento 1)
        id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Esperar antes de reintentar
        if: steps.d1.outcome == 'failure'
        run: sleep 45

      - name: Publicar (intento 2)
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
